dbt_tmdb_profile:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'your-gcp-project-id') }}"
      dataset: tmdb_staging
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '/path/to/sa-key.json') }}"
      timeout_seconds: 300
      location: US