main:
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: "us-west1"

    # Step 1: Run the Python extractor job.
    # The jobs.run connector pauses the workflow until the execution finishes
    # (default timeout 30 min) and raises an error if the execution fails, so no
    # manual polling is needed and dbt never runs after a failed extraction.
    - run_extractor:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/tmdb-extractor-job"}
          location: ${location}
        result: extractor_execution

    # Step 2: Run dbt (also waits for completion and raises on failure).
    - run_dbt:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${"namespaces/" + project_id + "/jobs/tmdb-dbt-job"}
          location: ${location}
        result: dbt_execution

    - return_result:
        return:
          message: "Pipeline executed successfully!"
          extractor_execution: ${extractor_execution.metadata.name}
          dbt_execution: ${dbt_execution.metadata.name}
